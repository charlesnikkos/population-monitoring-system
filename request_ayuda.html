{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h2>Request Ayuda (Financial Assistance)</h2>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">For: {{ citizen.fullname }}</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Citizen Name</label>
                        <input type="text" class="form-control" value="{{ citizen.fullname }}" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Purok</label>
                        <input type="text" class="form-control" value="{{ citizen.purok }}" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" value="{{ citizen.address }}" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Ayuda Type <span class="text-danger">*</span></label>
                        <select name="ayuda_type" class="form-select" required>
                            <option>Cash Assistance</option>
                            <option>Food Assistance</option>
                            <option>Medical Assistance</option>
                            <option>Educational Assistance</option>
                            <option>Disaster Relief</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Amount (₱) <span class="text-danger">*</span></label>
                        <input type="number" name="amount" class="form-control" placeholder="0.00" step="0.01" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Date Requested <span class="text-danger">*</span></label>
                        <input type="date" name="date_requested" class="form-control" value="{{ today }}" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">Request Ayuda</button>
                        <a href="{{ url_for('ayuda') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
