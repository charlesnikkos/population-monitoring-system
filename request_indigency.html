{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h2>Request Certificate of Indigency</h2>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">For: {{ citizen.fullname }}</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Citizen Name</label>
                        <input type="text" class="form-control" value="{{ citizen.fullname }}" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Purok</label>
                        <input type="text" class="form-control" value="{{ citizen.purok }}" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" value="{{ citizen.address }}" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Reason <span class="text-danger">*</span></label>
                        <input type="text" name="reason" class="form-control" placeholder="e.g., Financial Assistance, Government Benefits" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Date Requested <span class="text-danger">*</span></label>
                        <input type="date" name="date_requested" class="form-control" value="{{ today }}" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">Request Certificate</button>
                        <a href="{{ url_for('indigency') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
